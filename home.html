<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>News Monitor — Latest Articles</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    body {
      font-family: system-ui;
      margin: 0;
      background: #f7f7f9;
      color: #111;
    }

    header {
      background: #0b5cff;
      color: #fff;
      padding: 14px 18px;
    }

    .container {
      max-width: 980px;
      margin: 18px auto;
      padding: 0 12px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
    }

    .thumb {
      width: 160px;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

    .meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .title {
      font-size: 16px;
      margin: 0 0 6px 0;
    }

    .snippet {
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .search,
    .filter,
    .date-input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: .5;
    }

    .empty {
      text-align: center;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1>News Monitor</h1>
      <div>Latest scraped articles</div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <input id="search" class="search" placeholder="Search..." />
      <select id="sourceFilter" class="filter">
        <option value="">All sources</option>
      </select>
      <input type="date" id="startDate" class="date-input" />
      <input type="date" id="endDate" class="date-input" />
      <button id="applyDateFilter">Filter</button>
      <div id="count"></div>
    </div>

    <div id="list"></div>
    <div id="loading" class="empty">Loading…</div>
    <div id="error" class="empty" style="display:none;"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script>
    const SPREADSHEET_ID = "1y_DXPvLZVC843ED6mXmCq2NsL5pF83JJSi_6C0W3L98";
    const SHEET_GID = "0";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

    const ARTICLES_PER_PAGE = 50;
    const INITIAL_ARTICLES_LIMIT = 400;

    let allArticles = [], displayedArticles = [], filteredArticles = [];
    let currentPage = 1, totalPages = 1;
    let customStartDate = null, customEndDate = null;

    const listEl = document.getElementById('list');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const paginationEl = document.getElementById('pagination');
    const searchInput = document.getElementById('search');
    const sourceFilter = document.getElementById('sourceFilter');
    const countEl = document.getElementById('count');


    // ✅ Robust CSV parser (fixes column shifting completely)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (cell || row.length) {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          }
        } else {
          cell += c;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }


    async function fetchSheet() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();

        const rows = parseCSV(text);
        rows.shift();

        allArticles = rows.map(r => {
          if (!r) return null;

          // enforce fixed schema
          const cols = new Array(8).fill('');

          for (let i = 0; i < Math.min(r.length, 8); i++) {
            cols[i] = (r[i] || '').replace(/^"|"$/g, '').trim();
          }

          if (r.length > 8) {
            cols[5] = r.slice(5, r.length - 2).join(',').trim();
            cols[6] = (r[r.length - 2] || '').trim();
            cols[7] = (r[r.length - 1] || '').trim();
          }

          return {
            source: cols[0].replace(/\s+/g, ' '),
            title: cols[1],
            date: cols[2],
            link: cols[3],
            author: cols[4],
            snippet: cols[5],
            image: cols[6],
            scraped_at: cols[7]
          };
        })
          .filter(a => a && (a.title || a.snippet));

        allArticles.reverse();

        // populate sources
        const sources = [...new Set(allArticles.map(a => a.source).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));

        sourceFilter.innerHTML = '<option value="">All sources</option>';
        sources.forEach(src => {
          const opt = document.createElement('option');
          opt.value = src;
          opt.textContent = src;
          sourceFilter.appendChild(opt);
        });

        displayedArticles = allArticles.slice(0, INITIAL_ARTICLES_LIMIT);

        render();

      } catch (e) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Failed to load data';
      }
    }


    function formatDate(ds) {
      if (!ds) return '';
      try {
        const p = ds.split(/[- :]/);
        if (p.length >= 5) {
          const d = new Date(p[0], p[1] - 1, p[2], p[3], p[4], p[5] || 0);
          return d.toLocaleDateString() + ' ' +
            d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
      } catch (e) { }
      return '';
    }


    function filterArticles() {
      const q = searchInput.value.toLowerCase();
      const sourceVal = sourceFilter.value;
      let start = customStartDate ? new Date(customStartDate) : new Date(0);
      let end = customEndDate ? new Date(customEndDate) : new Date();

      filteredArticles = allArticles.filter(a => {
        const d = new Date(a.date || a.scraped_at);
        if (d < start || d > end) return false;
        if (sourceVal && a.source !== sourceVal) return false;
        if (!q) return true;
        return a.title.toLowerCase().includes(q) || a.snippet.toLowerCase().includes(q);
      });

      displayedArticles = filteredArticles;
      currentPage = 1;
    }


    function getPage() {
      const s = (currentPage - 1) * ARTICLES_PER_PAGE;
      return displayedArticles.slice(s, s + ARTICLES_PER_PAGE);
    }


    function scrollTopSmooth() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }


    function render() {
      loadingEl.style.display = 'none';
      listEl.innerHTML = '';

      if (!displayedArticles.length) {
        listEl.innerHTML = '<div class="empty">No articles</div>';
        return;
      }

      countEl.textContent = displayedArticles.length + ' articles';

      getPage().forEach(a => {
        const card = document.createElement('div');
        card.className = 'card';

        if (a.image) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = a.image;
          card.appendChild(img);
        }

        const body = document.createElement('div');

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = (a.source || 'Unknown') + ' • ' + formatDate(a.date || a.scraped_at);
        body.appendChild(meta);

        const h = document.createElement('h3');
        const link = document.createElement('a');
        link.href = a.link;
        link.target = '_blank';
        link.textContent = a.title;
        h.appendChild(link);
        body.appendChild(h);

        if (a.snippet) {
          const sn = document.createElement('div');
          sn.textContent = a.snippet;
          body.appendChild(sn);
        }

        const scrp = document.createElement('div');
        scrp.className = 'meta';
        scrp.textContent = 'Scraped at: ' + formatDate(a.scraped_at);
        body.appendChild(scrp);

        card.appendChild(body);
        listEl.appendChild(card);
      });

      renderPagination();
    }


    function renderPagination() {
      totalPages = Math.ceil(displayedArticles.length / ARTICLES_PER_PAGE);
      if (totalPages <= 1) return;

      paginationEl.innerHTML = '';

      const prev = document.createElement('button');
      prev.textContent = 'Prev';
      prev.disabled = currentPage === 1;
      prev.onclick = () => { currentPage--; render(); scrollTopSmooth(); };
      paginationEl.appendChild(prev);

      const info = document.createElement('span');
      info.textContent = `Page ${currentPage}/${totalPages}`;
      paginationEl.appendChild(info);

      const next = document.createElement('button');
      next.textContent = 'Next';
      next.disabled = currentPage === totalPages;
      next.onclick = () => { currentPage++; render(); scrollTopSmooth(); };
      paginationEl.appendChild(next);
    }


    searchInput.oninput = () => { filterArticles(); render(); };
    sourceFilter.onchange = () => { filterArticles(); render(); };

    document.getElementById('applyDateFilter').onclick = () => {
      customStartDate = document.getElementById('startDate').value || null;
      customEndDate = document.getElementById('endDate').value || null;
      filterArticles();
      render();
    };

    fetchSheet();
  </script>

</body>

</html>
