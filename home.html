<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>News Monitor — Latest Articles</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
body {font-family: system-ui; margin: 0; background: #f7f7f9;}
header {background:#0b5cff;color:#fff;padding:14px 18px;}
.container {max-width:980px;margin:18px auto;padding:0 12px;}

.card {background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;display:flex;gap:12px;}
.thumb {width:120px;height:90px;object-fit:cover;border-radius:6px;}
.meta {font-size:13px;color:#666;margin-bottom:6px;}
.title {font-size:16px;margin:0 0 6px;}
.snippet {font-size:14px;color:#333;}

.controls {display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
.search,.filter,.date-input {padding:8px;border:1px solid #ccc;border-radius:6px;}

.pagination {display:flex;justify-content:center;gap:10px;margin:20px;}
.pagination button {padding:8px 12px;cursor:pointer;}

#scrollTopBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #0b5cff;
  color: #fff;
  border: none;
  padding: 10px 14px;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  font-size: 18px;
}
</style>
</head>

<body>

<header>
  <h2>News Monitor</h2>
</header>

<main class="container">
<div class="controls">
<input id="search" class="search" placeholder="Search..." />
<select id="sourceFilter" class="filter"><option value="">All sources</option></select>
<input type="date" id="startDate" class="date-input"/>
<input type="date" id="endDate" class="date-input"/>
<button id="applyDateFilter">Filter</button>
</div>

<div id="list"></div>
<div id="pagination" class="pagination"></div>
</main>

<button id="scrollTopBtn">↑</button>

<script>
const SPREADSHEET_ID = "1y_DXPvLZVC843ED6mXmCq2NsL5pF83JJSi_6C0W3L98";
const SHEET_GID = "0";
const ARTICLES_PER_PAGE = 50;

const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;

let allArticles=[], displayedArticles=[], filteredArticles=[];
let currentPage=1;

const listEl=document.getElementById('list');
const paginationEl=document.getElementById('pagination');

function parseSheetDate(value){
  if(!value) return null;

  if(typeof value==="string"){
    if(value.startsWith("Date(")){
      const p=value.match(/\d+/g).map(Number);
      return new Date(p[0],p[1],p[2],p[3]||0,p[4]||0,p[5]||0);
    }
    return new Date(value);
  }

  return new Date(value);
}

// fallback logic
function resolveTimestamp(article){
  const pub=parseSheetDate(article.date);
  const scr=parseSheetDate(article.scraped_at);

  if(pub && !isNaN(pub)) return pub.getTime();
  if(scr && !isNaN(scr)) return scr.getTime();

  return 0;
}

function formatDate(val){
  const d=parseSheetDate(val);
  if(!d || isNaN(d)) return "No date";
  return d.toLocaleString();
}

async function fetchData(){
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.match(/setResponse\(([\s\S]+)\)/)[1]);

  allArticles=json.table.rows.slice(1).map(r=>{
    const v=r.c.map(c=>c?c.v:"");
    return {
      source:v[0],
      title:v[1],
      date:v[2],
      link:v[3],
      author:v[4],
      snippet:v[5],
      image:v[6],
      scraped_at:v[7]
    };
  });

  // assign timestamp + sort DESC (IMPORTANT FIX)
  allArticles.forEach(a=>a._ts=resolveTimestamp(a));
  allArticles.sort((a,b)=>b._ts-a._ts);

  displayedArticles=allArticles;
  render();
}

function render(){
  listEl.innerHTML="";

  const start=(currentPage-1)*ARTICLES_PER_PAGE;
  const pageItems=displayedArticles.slice(start,start+ARTICLES_PER_PAGE);

  pageItems.forEach(a=>{
    const div=document.createElement('div');
    div.className="card";

    if(a.image){
      const img=document.createElement('img');
      img.src=a.image;
      img.className="thumb";
      div.appendChild(img);
    }

    const body=document.createElement('div');

    const meta=document.createElement('div');
    meta.className="meta";
    meta.textContent=`${a.source} • ${formatDate(a.date || a.scraped_at)}`;

    const title=document.createElement('h3');
    title.className="title";
    title.innerHTML=`<a href="${a.link}" target="_blank">${a.title}</a>`;

    body.appendChild(meta);
    body.appendChild(title);

    if(a.snippet){
      const sn=document.createElement('div');
      sn.className="snippet";
      sn.textContent=a.snippet;
      body.appendChild(sn);
    }

    div.appendChild(body);
    listEl.appendChild(div);
  });

  renderPagination();
}

function renderPagination(){
  paginationEl.innerHTML="";
  const total=Math.ceil(displayedArticles.length/ARTICLES_PER_PAGE);

  const prev=document.createElement('button');
  prev.textContent="Prev";
  prev.disabled=currentPage===1;
  prev.onclick=()=>{currentPage--;render();scrollTop();};

  const next=document.createElement('button');
  next.textContent="Next";
  next.disabled=currentPage===total;
  next.onclick=()=>{currentPage++;render();scrollTop();};

  paginationEl.append(prev,document.createTextNode(` Page ${currentPage}/${total} `),next);
}

function scrollTop(){
  window.scrollTo({top:0,behavior:'smooth'});
}

// floating button
const btn=document.getElementById("scrollTopBtn");
window.onscroll=()=>{
  btn.style.display=window.scrollY>300?"block":"none";
};
btn.onclick=scrollTop;

fetchData();
</script>

</body>
</html>
